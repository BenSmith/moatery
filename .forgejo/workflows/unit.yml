# The unit gate: ruff (syntax, names, imports, 79 columns), then the
# suite under coverage of the shipped code, failing under .coveragerc's
# floor. Runs on every push and pull request; .github/workflows/unit.yml
# is the same gate on GitHub. A push to main that passes it publishes the
# RPM to this forge's RPM registry, the dnf repository the homelab's
# hypervisor images install moatery from.
#
# `just coverage` runs the tests, so this job gates both. The python
# tooling is installed here when the runner does not carry it.

name: unit

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: native
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tooling
        run: sudo dnf install -y just ruff python3-coverage bash-completion

      - name: Lint
        run: just lint

      - name: Test under coverage
        run: just coverage

  publish:
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: native
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tooling
        run: |
          sudo dnf install -y just rpm-build git-core python3-rpm-macros \
            openssl

      - name: Build RPM
        # The runner is persistent, so rpmbuild/ can hold earlier builds.
        run: |
          rm -rf rpmbuild
          just rpm

      - name: Publish RPM
        env:
          PKG_PUBLISH_TOKEN: ${{ secrets.PKG_PUBLISH_TOKEN }}
          UPLOAD: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/rpm/upload
        run: |
          set -- rpmbuild/RPMS/noarch/moatery-*.rpm
          if [ "$#" -ne 1 ]; then
            echo "::error::expected one moatery RPM, got: $*"
            exit 1
          fi
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          code=$(curl -sS -o "$log" -w '%{http_code}' \
            -H "Authorization: token ${PKG_PUBLISH_TOKEN}" \
            --upload-file "$1" "$UPLOAD")
          if [ "$code" != 201 ]; then
            echo "::error::uploading $1: HTTP $code"
            cat "$log"
            exit 1
          fi
          echo "published $(basename "$1")"
