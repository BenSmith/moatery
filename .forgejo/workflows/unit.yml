# The unit gate: ruff (syntax, names, imports, 79 columns), then the
# suite under coverage of the shipped code, failing under .coveragerc's
# floor. Runs on every push and pull request. The rpm-image workflow
# builds and tests the RPM; a tag vVERSION additionally publishes it.
#
# `just coverage` runs the tests, so this job gates both. The native
# runner carries podman for rpm-image; the python tooling is installed
# here when the image does not.

name: unit

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: native
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tooling
        run: sudo dnf install -y just ruff python3-coverage

      - name: Lint
        run: just lint

      - name: Test under coverage
        run: just coverage
