# The unit gate on GitHub, as .forgejo/workflows/unit.yml is on the
# forge: ruff, then the suite under coverage of the shipped code, failing
# under .coveragerc's floor. In Fedora, for the system python3 and
# OpenSSL the code is written against, and as a user rather than root,
# whom the suite's permission checks would not hold.
#
# A pushed tag vX.Y.Z whose suite passes is published as a GitHub
# release, which Packit builds into Copr (.packit.yaml). The tag must be
# VERSION's.
#
# The server_url guard keeps a Forgejo runner from taking this file too.

name: unit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 20
    steps:
      - name: Tooling
        run: >-
          dnf install -y git just ruff python3-coverage bash-completion
          openssl util-linux

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: A user to run as
        run: |
          useradd -m ci
          chown -R ci: "$GITHUB_WORKSPACE"

      - name: Lint
        run: runuser -u ci -- just lint

      - name: Test under coverage
        run: runuser -u ci -- just coverage

  release:
    needs: unit
    if: >-
      github.server_url == 'https://github.com'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG is not VERSION's v$version" >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag \
            --title "moatery $version" --generate-notes
