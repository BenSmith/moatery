# The inspector's per-request record, rotated by the user who runs it
# (customs-logrotate.service). logrotate expands no variables: replace
# USER, or the whole path if XDG_STATE_HOME is set.
#
# `postrotate` + HUP rather than `copytruncate`, which races an in-flight
# write and can tear a record in half. On the HUP the inspector reopens
# the path, creating it 0600 as itself, hence `nocreate`. It does so at
# its next write, so an idle inspector still holds the old file open:
# hence `delaycompress`. `|| true` because an inspector that has not been
# started yet is not an error, and a failing postrotate aborts the run.
#
# The sizes are a starting point, not measured. `maxsize` matters more
# than `rotate`: a full disk costs more than a short history.
/home/USER/.local/state/log/customs/requests.log {
    daily
    rotate 14
    maxsize 100M
    missingok
    notifempty
    nocreate
    compress
    delaycompress
    postrotate
        systemctl --user kill -s HUP customs-inspect.service || true
    endscript
}
