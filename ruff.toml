# `just lint`. Syntax, undefined names, unused imports, and 79 columns;
# no style rules beyond that, and no formatter (measured and declined: it
# explodes paired argv lists).
line-length = 79
include = ["moatery/*.py", "moathut/*.py", "bin/moathut",
           "libexec/moat-broker", "libexec/moat-inspect",
           "libexec/moat-mint-ca", "libexec/moat-netns-listen",
           "libexec/moat-resolve", "container/moat-sidecar",
           "tests/manual/*.py"]

[lint]
select = ["E4", "E7", "E9", "F", "E501"]

[lint.per-file-ignores]
# sys.dont_write_bytecode has to be set before the imports it governs.
"libexec/moat-broker" = ["E402"]
"libexec/moat-inspect" = ["E402"]
"libexec/moat-mint-ca" = ["E402"]
"libexec/moat-netns-listen" = ["E402"]
"libexec/moat-resolve" = ["E402"]
"container/moat-sidecar" = ["E402"]
"bin/moathut" = ["E402"]
