# `just lint`. Syntax, undefined names, unused imports, and 79 columns;
# no style rules beyond that, and no formatter (measured and declined: it
# explodes paired argv lists).
line-length = 79
include = ["customs/*.py", "customs_box/*.py", "bin/customs-box",
           "libexec/customs-broker", "libexec/customs-inspect",
           "libexec/customs-mint-ca", "libexec/customs-netns-listen",
           "libexec/customs-resolve", "container/customs-sidecar",
           "tests/manual/*.py"]

[lint]
select = ["E4", "E7", "E9", "F", "E501"]

[lint.per-file-ignores]
# sys.dont_write_bytecode has to be set before the imports it governs.
"libexec/customs-broker" = ["E402"]
"libexec/customs-inspect" = ["E402"]
"libexec/customs-mint-ca" = ["E402"]
"libexec/customs-netns-listen" = ["E402"]
"libexec/customs-resolve" = ["E402"]
"container/customs-sidecar" = ["E402"]
"bin/customs-box" = ["E402"]
